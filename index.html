<!DOCTYPE html>
<html lang="pt-BR" class="antialiased">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Minhas Compras • Smart Shopping Manager</title>
  <meta name="description" content="Gerenciador inteligente de compras mensais com comparativo de preços históricos e design Lumina Lifestyle.">
  
  <!-- PWA & Mobile Web Meta Tags -->
  <meta name="theme-color" content="#fff8f5">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Minhas Compras">
  
  <!-- PWA Manifest & App Icons -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">

  <!-- Tailwind CSS CDN with forms and container queries -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Google Material Symbols Outlined -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">

  <!-- Tailwind Configuration matching Stitch Lumina Lifestyle tokens -->
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#944a00",
            "on-primary": "#ffffff",
            "primary-container": "#e67e22",
            "on-primary-container": "#502600",
            "primary-fixed": "#ffdcc5",
            "primary-fixed-dim": "#ffb783",
            "on-primary-fixed": "#301400",
            "on-primary-fixed-variant": "#713700",
            "inverse-primary": "#ffb783",
            
            "secondary": "#006d37",
            "on-secondary": "#ffffff",
            "secondary-container": "#7bf8a1",
            "on-secondary-container": "#007239",
            "secondary-fixed": "#7efba4",
            "secondary-fixed-dim": "#61de8a",
            "on-secondary-fixed": "#00210c",
            "on-secondary-fixed-variant": "#005228",

            "tertiary": "#b4271d",
            "on-tertiary": "#ffffff",
            "tertiary-container": "#ff6856",
            "on-tertiary-container": "#6a0001",
            "tertiary-fixed": "#ffdad5",
            "tertiary-fixed-dim": "#ffb4a9",
            "on-tertiary-fixed": "#410000",
            "on-tertiary-fixed-variant": "#910807",

            "error": "#ba1a1a",
            "on-error": "#ffffff",
            "error-container": "#ffdad6",
            "on-error-container": "#93000a",

            "background": "#fff8f5",
            "on-background": "#231a13",
            "surface": "#fff8f5",
            "on-surface": "#231a13",
            "surface-dim": "#e9d6cc",
            "surface-bright": "#fff8f5",
            "surface-container-lowest": "#ffffff",
            "surface-container-low": "#fff1ea",
            "surface-container": "#feeadf",
            "surface-container-high": "#f8e4da",
            "surface-container-highest": "#f2dfd4",
            "surface-variant": "#f2dfd4",
            "on-surface-variant": "#564337",
            "inverse-surface": "#392e27",
            "inverse-on-surface": "#ffede4",
            "surface-tint": "#944a00",

            "outline": "#897365",
            "outline-variant": "#dcc1b1"
          },
          borderRadius: {
            "DEFAULT": "0.5rem",
            "sm": "0.25rem",
            "md": "0.75rem",
            "lg": "1rem",
            "xl": "1.25rem",
            "2xl": "1.5rem",
            "3xl": "1.75rem",
            "full": "9999px"
          },
          spacing: {
            "group-margin-bottom": "1.5rem",
            "stack-gap-sm": "0.5rem",
            "stack-gap-md": "1rem",
            "card-inner-padding": "1rem",
            "container-padding": "1.25rem"
          },
          fontFamily: {
            "body-lg": ["Plus Jakarta Sans", "sans-serif"],
            "price-display": ["Plus Jakarta Sans", "sans-serif"],
            "headline-xl": ["Plus Jakarta Sans", "sans-serif"],
            "body-sm": ["Plus Jakarta Sans", "sans-serif"],
            "headline-md": ["Plus Jakarta Sans", "sans-serif"],
            "headline-xl-mobile": ["Plus Jakarta Sans", "sans-serif"],
            "label-caps": ["Plus Jakarta Sans", "sans-serif"]
          },
          fontSize: {
            "body-lg": ["16px", { "lineHeight": "20px", "fontWeight": "600" }],
            "price-display": ["20px", { "lineHeight": "24px", "fontWeight": "700" }],
            "headline-xl": ["28px", { "lineHeight": "34px", "fontWeight": "700" }],
            "body-sm": ["14px", { "lineHeight": "18px", "fontWeight": "400" }],
            "headline-md": ["18px", { "lineHeight": "24px", "fontWeight": "600" }],
            "headline-xl-mobile": ["24px", { "lineHeight": "30px", "fontWeight": "700" }],
            "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "700" }]
          }
        }
      }
    };
  </script>

  <!-- Custom App Styles -->
  <link rel="stylesheet" href="css/app.css">
</head>
<body class="bg-background text-on-surface antialiased min-h-screen">
  
  <!-- PWA Install Floating Banner (Shown dynamically when installable) -->
  <div id="pwa-install-banner" class="hidden fixed top-3 left-4 right-4 max-w-[508px] mx-auto z-50 bg-surface-container-lowest/95 backdrop-blur-md rounded-2xl p-3 border border-primary-fixed-dim/60 shadow-xl slide-up">
    <div class="flex items-center justify-between gap-3">
      <img src="icons/icon-192.png" alt="App Icon" class="w-11 h-11 rounded-xl shadow-sm">
      <div class="flex-1 min-w-0">
        <h4 class="font-bold text-xs text-on-surface truncate">Instalar Minhas Compras</h4>
        <p class="text-[11px] text-on-surface-variant truncate">Acesso rápido e offline no seu celular</p>
      </div>
      <div class="flex items-center gap-1.5">
        <button onclick="window.triggerPWAInstall()" class="px-3 py-1.5 bg-primary text-white text-xs font-bold rounded-xl shadow-sm hover:opacity-90 active:scale-95 transition-all">
          Instalar
        </button>
        <button onclick="window.dismissPWABanner()" class="p-1 rounded-lg text-outline hover:text-on-surface">
          <span class="material-symbols-outlined text-[18px]">close</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Root App Mount -->
  <div id="app"></div>

  <!-- Modal Container -->
  <div id="modal-container"></div>

  <!-- Toast Container -->
  <div id="toast-container"></div>

  <!-- QR Code Generator Library -->
  <script src="js/lib/qrcode.js"></script>

  <!-- Application Scripts -->
  <script src="js/store.js"></script>
  <script src="js/components/totalBar.js"></script>
  <script src="js/components/modals.js"></script>
  <script src="js/views/homeView.js"></script>
  <script src="js/views/cartView.js"></script>
  <script src="js/views/categoriesView.js"></script>
  <script src="js/views/historyView.js"></script>
  <script src="js/views/settingsView.js"></script>
  <script src="js/app.js"></script>

  <!-- Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then((reg) => {
            console.log('[PWA] Service Worker registrado com sucesso! Escopo:', reg.scope);
          })
          .catch((err) => {
            console.warn('[PWA] Falha ao registrar Service Worker:', err);
          });
      });
    }
  </script>
</body>
</html>
